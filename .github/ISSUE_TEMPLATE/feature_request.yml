name: Feature request
description: Propose a change to a Boing Network product.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: repo
    attributes:
      label: Repository
      description: Which official repository should own this work?
      options:
        - boing.network (protocol, node, SDK, website)
        - boing.observer (explorer)
        - boing.express (wallet)
        - boing.finance (DeFi)
        - Organization / .github
        - Unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Link alignment or handoff docs if this crosses repos.
    validations:
      required: true
